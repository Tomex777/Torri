name: Torri stable release (manual, signed)

# Safe staging only. Publishing the GitHub draft remains a separate manual act.
# Reuse existing dedicated TORRI_* or historical release-workflow signing names;
# certificate fingerprint must still match TORRI_RELEASE_CERT_SHA256.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/torri-stable-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed_stable_draft:
    if: github.repository == 'Tomex777/Torri' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release identity and signing prerequisites
        shell: bash
        env:
          TORRI_SIGNING_KEY_BASE64: ${{ secrets.TORRI_SIGNING_KEY_BASE64 || secrets.SIGNING_KEY }}
          TORRI_STORE_PASSWORD: ${{ secrets.TORRI_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          TORRI_KEY_ALIAS: ${{ secrets.TORRI_KEY_ALIAS || secrets.ALIAS }}
          TORRI_KEY_PASSWORD: ${{ secrets.TORRI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          TORRI_RELEASE_CERT_SHA256: ${{ secrets.TORRI_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "app.torri"' app/build.gradle.kts
          grep -Fq 'versionName = "1.1.0"' app/build.gradle.kts
          grep -Fq 'versionCode = 10001' app/build.gradle.kts
          for value in TORRI_SIGNING_KEY_BASE64 TORRI_STORE_PASSWORD TORRI_KEY_ALIAS TORRI_KEY_PASSWORD TORRI_RELEASE_CERT_SHA256; do
            test -n "${!value}" || { echo "::error::Missing required release signing secret: $value"; exit 1; }
          done
          printf '%s' "$TORRI_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/torri-production.keystore"
          chmod 600 "$RUNNER_TEMP/torri-production.keystore"
          test -s "$RUNNER_TEMP/torri-production.keystore"
          echo "Signatures will be checked against the registered Torri production SHA-256 certificate."

      - name: Run tests, migration checks and signed release build
        env:
          MIHON_GITHUB_RELEASE: 'true'
          storeFile: ${{ runner.temp }}/torri-production.keystore
          storePassword: ${{ secrets.TORRI_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.TORRI_KEY_ALIAS || secrets.ALIAS }}
          keyPassword: ${{ secrets.TORRI_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration assembleRelease -Penable-updater

      - name: Validate production APK identity, signature and checksum
        shell: bash
        env:
          TORRI_RELEASE_CERT_SHA256: ${{ secrets.TORRI_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/torri-v1.1.0-universal.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/torri-v1.1.0-arm64-v8a.apk
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          expected="$(printf '%s' "$TORRI_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          for apk in dist/*.apk; do
            "$TOOL_DIR/aapt" dump badging "$apk" | tee /tmp/torri-badging.txt
            grep -Eq "^package: name='app.torri' versionCode='10001' versionName='1.1.0'" /tmp/torri-badging.txt
            "$TOOL_DIR/apksigner" verify --verbose "$apk"
            actual="$("$TOOL_DIR/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Production signing certificate mismatch. Refusing to stage release."
              exit 1
            fi
            sha256sum "$apk" >> dist/SHA256SUMS.txt
          done

      - name: Free hosted-runner disk and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/ndk"
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install actual production-signed APK on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/torri-production-smoke.sh

      - name: Create GitHub DRAFT release, never publish automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already has a release: $TAG"
            exit 1
          fi
          printf '%s\n' \
            'Torri by Night 1.1.0 (DRAFT)' \
            '' \
            'Upstream Mihon 0.21.2 performance, database, download, reader, extension and Cloudflare improvements.' \
            'Database migration can merge duplicate records irreversibly. Export and verify a backup first.' \
            'Not published until physical-device install/migration testing and certificate verification pass.' > dist/RELEASE-NOTES.txt
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title 'Torri by Night v1.1.0 (DRAFT)' \
            --notes-file dist/RELEASE-NOTES.txt \
            dist/*.apk \
            dist/SHA256SUMS.txt \
            "$RUNNER_TEMP/torri-production-android15.png"
