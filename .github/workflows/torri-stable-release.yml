name: Torri stable release (manual, signed)

# Safe staging only. Publishing the GitHub draft remains a separate manual act.
# Runs from main only, after the v0.21.2 integration has been tested and merged.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed_stable_draft:
    if: github.repository == 'Tomex777/Torri' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release identity and signing prerequisites
        shell: bash
        env:
          TORRI_SIGNING_KEY_BASE64: ${{ secrets.TORRI_SIGNING_KEY_BASE64 }}
          TORRI_STORE_PASSWORD: ${{ secrets.TORRI_STORE_PASSWORD }}
          TORRI_KEY_ALIAS: ${{ secrets.TORRI_KEY_ALIAS }}
          TORRI_KEY_PASSWORD: ${{ secrets.TORRI_KEY_PASSWORD }}
          TORRI_RELEASE_CERT_SHA256: ${{ secrets.TORRI_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "app.torri"' app/build.gradle.kts
          grep -Fq 'versionName = "0.21.2"' app/build.gradle.kts
          grep -Fq 'versionCode = 38' app/build.gradle.kts
          for value in TORRI_SIGNING_KEY_BASE64 TORRI_STORE_PASSWORD TORRI_KEY_ALIAS TORRI_KEY_PASSWORD TORRI_RELEASE_CERT_SHA256; do
            test -n "${!value}" || { echo "::error::Missing required release signing secret: $value"; exit 1; }
          done
          printf '%s' "$TORRI_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/torri-production.keystore"
          chmod 600 "$RUNNER_TEMP/torri-production.keystore"
          test -s "$RUNNER_TEMP/torri-production.keystore"
          echo "Signatures will be checked against the registered Torri production SHA-256 certificate."

      - name: Run tests, migration checks and signed release build
        env:
          MIHON_GITHUB_RELEASE: 'true'
          storeFile: ${{ runner.temp }}/torri-production.keystore
          storePassword: ${{ secrets.TORRI_STORE_PASSWORD }}
          keyAlias: ${{ secrets.TORRI_KEY_ALIAS }}
          keyPassword: ${{ secrets.TORRI_KEY_PASSWORD }}
        run: ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration assembleRelease

      - name: Validate production APK identity, signature and checksum
        shell: bash
        env:
          TORRI_RELEASE_CERT_SHA256: ${{ secrets.TORRI_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/torri-v0.21.2-universal.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/torri-v0.21.2-arm64-v8a.apk
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          expected="$(printf '%s' "$TORRI_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          for apk in dist/*.apk; do
            "$TOOL_DIR/aapt" dump badging "$apk" | tee /tmp/torri-badging.txt
            grep -Eq "^package: name='app.torri' versionCode='38' versionName='0.21.2'" /tmp/torri-badging.txt
            "$TOOL_DIR/apksigner" verify --verbose "$apk"
            actual="$("$TOOL_DIR/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Production signing certificate mismatch. Refusing to stage release."
              exit 1
            fi
            sha256sum "$apk" >> dist/SHA256SUMS.txt
          done

      - name: Create GitHub DRAFT release, never publish automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.21.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already has a release: $TAG"
            exit 1
          fi
          printf '%s\n' \
            'Torri by Night 0.21.2 (DRAFT)' \
            '' \
            'Upstream Mihon 0.21.2 performance, database, download, reader, extension and Cloudflare improvements.' \
            'Database migration can merge duplicate records irreversibly. Export and verify a backup first.' \
            'Not published until physical-device install/migration testing and certificate verification pass.' > dist/RELEASE-NOTES.txt
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title 'Torri by Night v0.21.2 (DRAFT)' \
            --notes-file dist/RELEASE-NOTES.txt \
            dist/*.apk \
            dist/SHA256SUMS.txt
