name: Build & Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main
      - 'torri/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package Torri source
        if: github.event_name != 'pull_request'
        run: git archive --format=zip --output="Torri-source-${GITHUB_SHA}.zip" HEAD

      - name: Upload Torri source
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: torri-source-${{ github.sha }}
          path: Torri-source-${{ github.sha }}.zip
          retention-days: 14

      - name: Dependency Review
        continue-on-error: true # Advanced Security dependency review unavailable on this repo
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        continue-on-error: true
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build app
        run: ./gradlew assembleRelease

      - name: Verify Torri package and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"Tomex777/Torri"' app/src/main/java/eu/kanade/tachiyomi/data/updater/AppUpdateChecker.kt
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-universal-release.apk \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk; do
            test -s "$apk"
            "$SDK_BUILD_TOOLS/aapt" dump badging "$apk" | tee /tmp/torri-package.txt
            grep -Eq "^package: name='app.torri' versionCode='10001' versionName='1.1.0'" /tmp/torri-package.txt
            "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$apk"
          done

      - name: Upload APK
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: torri-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload universal APK
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: torri-universal-${{ github.sha }}
          path: app/build/outputs/apk/release/app-universal-release.apk

      - name: Upload mapping
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: torri-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
