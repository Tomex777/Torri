name: Show Torri Android screenshots

on:
  push:
    branches:
      - preview/torri-actual-ui-screens
    paths:
      - .github/workflows/torri-ui-send-images.yml

permissions:
  contents: read

jobs:
  screenshot_images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout captured Android UI images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare small real screenshot JPEGs for chat
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          screens = {
              "studio": "docs/screenshots/torri-actual-theme-studio.png",
              "picker": "docs/screenshots/torri-actual-theme-studio-picker.png",
              "continue": "docs/screenshots/torri-continue-component-preview.png",
          }
          for name, source in screens.items():
              im = Image.open(source).convert("RGB")
              im.thumbnail((500, 900))
              im.save("/tmp/torri_" + name + ".jpg", "JPEG", quality=48, optimize=True, subsampling=0)
              print(name, im.size)
          PY
      - name: Emit real captured screenshots in compact form
        run: |
          set -euo pipefail
          for name in studio picker continue; do
            echo "START_${name}_JPEG"
            base64 -w 0 "/tmp/torri_${name}.jpg"
            echo
            echo "END_${name}_JPEG"
          done
