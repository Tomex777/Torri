name: Torri 1.1.0 private unsigned APK handoff

on:
  push:
    branches: [main]
    paths: [.github/workflows/torri-unsigned-transfer.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package_unsigned:
    if: github.repository == 'Tomex777/Torri' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out exact Torri private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile unsigned production APKs from Torri private source
        env:
          TORRI_UNSIGNED_HANDOFF: 'true'
        run: ./gradlew --no-daemon --console=plain assembleRelease
      - name: Validate no test signer, package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for variant in arm64-v8a universal; do
            SRC="$(find app/build/outputs/apk/release -type f -name "*${variant}*release*unsigned*.apk" -print -quit)"
            test -s "$SRC" || { echo "::error::Unsigned $variant APK not produced"; exit 1; }
            "$TOOLS/aapt" dump badging "$SRC" | grep -Eq "^package: name='app.torri' versionCode='10001' versionName='1.1.0'"
            if "$TOOLS/apksigner" verify "$SRC" >/dev/null 2>&1; then
              echo "::error::Unexpected signer in unsigned handoff"
              exit 1
            fi
            cp "$SRC" "handoff/Torri-1.1.0-${variant}-unsigned.apk"
            sha256sum "handoff/Torri-1.1.0-${variant}-unsigned.apk" >> handoff/SHA256SUMS.txt
          done
          echo "$GITHUB_SHA" > handoff/source-commit.txt
          echo 'PASS: exact Torri production IDs, UNSIGNED outputs, SHA256 checksums verified'
      # GitHub Actions artifact storage quota is exhausted, so this handoff
      # uses private repository text chunks. The private Torri code stays private.
      - name: Stage lossless base64 APK chunks on private Torri handoff branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/relay/arm64-v8a handoff/relay/universal
          for variant in arm64-v8a universal; do
            base64 -w 0 "handoff/Torri-1.1.0-${variant}-unsigned.apk" |
              split -b 880000 -d -a 3 - "handoff/relay/${variant}/part-"
            printf '%s %s\n' "$variant" "$(find "handoff/relay/${variant}" -name 'part-*' | wc -l)" >> handoff/relay/part-counts.txt
          done
          cp handoff/SHA256SUMS.txt handoff/relay/SHA256SUMS.txt
          cp handoff/source-commit.txt handoff/relay/source-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C ci/torri-unsigned-part-handoff
          git add -f handoff/relay/
          git commit -m 'ci: private-only Torri 1.1.0 unsigned APK relay data'
          git push --force origin HEAD:refs/heads/ci/torri-unsigned-part-handoff
          echo 'PASS: unsigned APK components staged privately; no source sent to Build.'
