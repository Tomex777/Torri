name: Capture Torri UI on Android emulator

on:
  push:
    branches:
      - preview/torri-actual-ui-screens
    paths:
      - .github/workflows/torri-ui-preview-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real_screens:
    if: github.repository == 'Tomex777/Torri'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout Torri with temporary debug preview host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile debug app with capture activity
        run: ./gradlew assembleDebug
      - name: Clear disk space and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/ndk"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render actual Torri Compose screens on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/torri-capture-ui.sh
      - name: Publish UI component screenshots on preview branch
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/screenshots/torri-actual-theme-studio.png
          test -s docs/screenshots/torri-continue-component-preview.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/screenshots/torri-actual-theme-studio.png docs/screenshots/torri-continue-component-preview.png
          git commit -m 'docs: Android 15 Compose screenshots for theme studio and continue'
          git push origin HEAD:preview/torri-actual-ui-screens
