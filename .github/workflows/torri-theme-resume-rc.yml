name: Torri polished Theme Studio and compact Resume RC

# One-time draft RC build. GitHub Actions artifact quota is exhausted, so save
# installable APKs to a private DRAFT release instead of upload-artifact.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/torri-theme-resume-rc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed_test_apk:
    if: github.repository == 'Tomex777/Torri' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify correct Torri sources and production package isolation
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "app.torri"' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".rc"' app/build.gradle.kts
          grep -Fq 'versionName = "1.1.0"' app/build.gradle.kts
          grep -Fq 'AppTheme.CUSTOM' app/src/main/java/eu/kanade/presentation/theme/TachiyomiTheme.kt
          grep -Fq 'LibraryResumePrompt' app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryTab.kt
          ! grep -R 'torri_offline_pack_ready' app/src/main/java
      - name: Compile and sign parallel-install RC
        run: ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration assembleRc
      - name: Verify signed APKs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/rc/app-arm64-v8a-rc.apk dist/torri-v1.1.0-theme-resume-rc2-arm64.apk
          cp app/build/outputs/apk/rc/app-universal-rc.apk dist/torri-v1.1.0-theme-resume-rc2-universal.apk
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in dist/*.apk; do
            "$TOOL_DIR/aapt" dump badging "$apk" | tee /tmp/torri-rc-badging.txt
            grep -Eq "^package: name='app.torri.rc' versionCode='10001' versionName='1.1.0-rc2'" /tmp/torri-rc-badging.txt
            "$TOOL_DIR/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk" >> dist/SHA256SUMS.txt
          done
      - name: Create private TEST-ONLY draft release with signed APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.0-torri-theme-resume-rc2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Draft RC already exists; refusing to replace an existing signing identity."
            exit 1
          fi
          cat > dist/RELEASE-NOTES.txt <<'EOF'
          Torri by NIGHT 1.1.0 Theme Gallery and Continue Reading — RC2

          Includes the new Theme Gallery, six extra palettes, Torri's own
          draggable color picker with hex entry and light/dark background
          settings, and a dismissible 15-second library Continue shortcut.

          Continue Reading now uses a compact, two-line banner with a vector icon
          and saved chapter number. Theme Studio has a custom HEX field,
          segmented controls, larger live color preview and refined picker.
          No Library layout, Library navigation icon, offline readiness or
          language changes are included.

          TEST BUILD ONLY — package app.torri.rc; installs next to app.torri.
          APK has been signed with the CI build's TEST certificate, not the
          existing permanent production signing certificate. Do not use as
          an update to your installed production Torri. Existing RC builds
          signed with another certificate may need uninstalling first.

          Production signing is blocked until Torri's protected signing key
          and pinned certificate fingerprint are available in CI.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Torri by NIGHT 1.1.0 Theme & Resume RC2 (TEST ONLY)" \
            --notes-file dist/RELEASE-NOTES.txt \
            dist/torri-v1.1.0-theme-resume-rc2-arm64.apk \
            dist/torri-v1.1.0-theme-resume-rc2-universal.apk \
            dist/SHA256SUMS.txt
          gh release view "$TAG" --json url,name,isDraft,isPrerelease

  android_smoke:
    name: Install test-signed Torri RC on Android 15
    needs: signed_test_apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download staged signed APK without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v1.1.0-torri-theme-resume-rc2" --pattern '*-universal.apk' --dir dist
          test -s dist/torri-v1.1.0-theme-resume-rc2-universal.apk
      - name: Free space and enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/ndk"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and background-resume Torri RC
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/torri-rc2-smoke.sh
